<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Happy Graduation</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    overflow:hidden;
    background:linear-gradient(to bottom,#ffd6e7,#fff0f5);
    height:100vh;
    color:white;
}

.screen{
    width:100%;
    height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    position:absolute;
    top:0;
    left:0;
    padding:30px;
    text-align:center;
    transition:0.8s;
}

.hidden{
    opacity:0;
    pointer-events:none;
    transform:scale(1.05);
}

h1{
    font-size:28px;
    line-height:1.5;
    color:#ff4f8b;
    margin-bottom:30px;
    text-shadow:0 0 10px rgba(255,255,255,0.6);
}

input{
    width:100%;
    max-width:320px;
    padding:15px;
    border:none;
    border-radius:18px;
    outline:none;
    font-size:16px;
    background:rgba(255,255,255,0.7);
    color:#ff4f8b;
    text-align:center;
    backdrop-filter:blur(10px);
}

button{
    margin-top:15px;
    padding:13px 28px;
    border:none;
    border-radius:20px;
    background:#ff6fa5;
    color:white;
    font-size:16px;
    cursor:pointer;
    transition:0.3s;
}

button:active{
    transform:scale(0.95);
}

.error{
    margin-top:12px;
    color:#ff2d55;
    font-size:14px;
}

.page{
    width:100%;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:35px;
    position:absolute;
    top:0;
    left:0;

    opacity:0;
    visibility:hidden;

    pointer-events:none;
    transition:opacity 1s;
}

.page.active{
    opacity:1;
    visibility:visible;
    pointer-events:auto;
}

.text-box{
    font-size:24px;
    line-height:1.8;
    color:#ff4f8b;
    font-weight:500;
    min-height:150px;
    white-space:pre-line;
}

.tap{
    position:absolute;
    bottom:40px;
    font-size:14px;
    color:#ff7da8;
    animation:blink 1.5s infinite;
}

@keyframes blink{
    0%{opacity:0.3;}
    50%{opacity:1;}
    100%{opacity:0.3;}
}

/* floating hearts */
.heart{
    position:absolute;
    bottom:-20px;
    color:#ff8db7;
    animation:float 6s linear infinite;
    opacity:0.6;
}

.envelope-container{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
}

.envelope{
    width:280px;
    max-width:80vw;
    transition:0.5s;
    animation:pop 2s infinite ease-in-out;
}

.videoPlayer{
    width:100%;
    height:100%;
    object-fit:cover;

    opacity:1 !important;
    display:block;

    backface-visibility:hidden;
    -webkit-backface-visibility:hidden;

    transform:translateZ(0);
    -webkit-transform:translateZ(0);    
}

.videoTap{
    position:absolute;
    bottom:40px;
    color:white;
    font-size:14px;
    opacity:0;
    transition:0.5s;
}

@keyframes pop{
    0%{
        transform:scale(1);
    }
    50%{
        transform:scale(1.03);
    }
    100%{
        transform:scale(1);
    }
}

@keyframes float{
    0%{
        transform:translateY(0) scale(1);
        opacity:0;
    }
    20%{
        opacity:0.7;
    }
    100%{
        transform:translateY(-110vh) scale(1.8);
        opacity:0;
    }
}
</style>
</head>

<body>

<!-- LOGIN PAGE -->
<div class="screen" id="loginScreen">

    <h1>
        halloo, happy graduation yaaa!!<br><br>
        password buaat masuknya nanti aku kasih pas kamu udahh di rumahh, kabarin ajaa!!
    </h1>

    <input type="teks" id="password" placeholder="masukkan password...">

    <button onclick="checkPassword()">masuk</button>

    <div class="error" id="errorText"></div>

</div>


<!-- PAGE 1 -->
<div class="page" id="page1">
    <div>
        <div class="text-box" id="text1"></div>
        <div class="tap">tap to continue ♡</div>
    </div>
</div>

<!-- PAGE 2 -->
<div class="page" id="page2">
    <div>
        <div class="text-box" id="text2"></div>
        <div class="tap">tap to continue ♡</div>
    </div>
</div>

<!-- PAGE 3 -->
<div class="page" id="page3">
    <div>
        <div class="text-box" id="text3"></div>
        <div class="tap">tap to continue ♡</div>
    </div>
</div>

<!-- PAGE 4 -->
<div class="page" id="page4">
    <div>
        <div class="text-box" id="text4"></div>
        <div class="tap">tap to continue ♡</div>
    </div>
</div>

<!-- VIDEO 1 -->
<div class="page" id="videoPage1">

    <video class="videoPlayer" playsinline>
        <source src="videos/video1.mp4" type="video/mp4">
    </video>
</div>

<!-- VIDEO 2 -->
<div class="page" id="videoPage2">

    <video class="videoPlayer" playsinline>
        <source src="videos/video2.mp4" type="video/mp4">
    </video>
</div>

<!-- VIDEO 3 -->
<div class="page" id="videoPage3">

    <video class="videoPlayer" playsinline>
        <source src="videos/video3.mp4" type="video/mp4">
    </video>
</div>

<!-- VIDEO 4 -->
<div class="page" id="videoPage4">

    <video class="videoPlayer" playsinline>
        <source src="videos/video4.mp4" type="video/mp4">
    </video>
</div>

<!-- VIDEO 5 -->
<div class="page" id="videoPage5">

    <video class="videoPlayer" playsinline>
        <source src="videos/video5.mp4" type="video/mp4">
    </video>
</div>

<!-- VIDEO 6 -->
<div class="page" id="videoPage6">

    <video class="videoPlayer" playsinline>
        <source src="videos/video6.mp4" type="video/mp4">
    </video>
</div>

<!-- ENVELOPE PAGE -->
<div class="page" id="page5">
    
    <div class="envelope-container">

        <img src="assets/amplop1.png" id="envelopeImage" class="envelope">

        <div class="tap">
            tap the envelope ♡
        </div>

    </div>

</div>


<!-- AUDIO -->
<audio id="bgm" loop>
    <source src="musik.mp3" type="audio/mp3">
</audio>


<script>

/* =========================
   EDIT TULISAN DI SINI
========================= */

const message1 = `YEYYYYYY GRADDD!! CONGRATS YAAAA`;

const message2 = `syumm pasti kamuu capek poll buat hari iniii \n it's okey lah yaa last day in SMADALA`;

const message3 = `SO PROUD OF YOU BISA NGELEWATIN MASA MASA INIIII`;

const message4 = `jujur deg-degan bangeett rasanya aku ngasih web ini ke kamuu \n tapi semoga kamu ngga shock yaa`;

/* ========================= */


const pages = [
    document.getElementById("page1"),
    document.getElementById("page2"),
    document.getElementById("page3"),
    document.getElementById("page4"),

     document.getElementById("videoPage1"),
    document.getElementById("videoPage2"),
    document.getElementById("videoPage3"),
    document.getElementById("videoPage4"),
    document.getElementById("videoPage5"),
    document.getElementById("videoPage6"),


    document.getElementById("page5")
];

let currentPage = 0;

function checkPassword(){

    const input = document.getElementById("password").value;
    const error = document.getElementById("errorText");

    if(input.toLowerCase() === "terry gemas"){

        document.getElementById("loginScreen").classList.add("hidden");

        pages[0].classList.add("active");

        typeWriter("text1", message1);

        document.getElementById("bgm").play();

    }else{
        error.innerText = "passwordnya salahh :(";
    }
}

pages.forEach((page,index)=>{

    page.addEventListener("click",()=>{

        if(index < pages.length - 1){

            pages[index].classList.remove("active");

            pages[index + 1].classList.add("active");

            currentPage++;

            if(currentPage === 1){
                typeWriter("text2", message2);
            }

            if(currentPage === 2){
                typeWriter("text3", message3);
            }

            if(currentPage === 3){
                typeWriter("text4", message4);
            }
        }

    });

});

function typeWriter(elementId, text){

    let i = 0;
    const speed = 35;

    document.getElementById(elementId).innerHTML = "";

    function typing(){

        if(i < text.length){

            document.getElementById(elementId).innerHTML += text.charAt(i);
            i++;
            setTimeout(typing, speed);

        }

    }

    typing();

}

/* floating hearts */

function createHeart(){

    const heart = document.createElement("div");

    heart.classList.add("heart");

    heart.innerHTML = "♡";

    heart.style.left = Math.random() * 100 + "vw";

    heart.style.fontSize = (Math.random() * 20 + 15) + "px";

    heart.style.animationDuration = (Math.random() * 3 + 4) + "s";

    document.body.appendChild(heart);

    setTimeout(()=>{
        heart.remove();
    },7000);

}

const envelopeImage = document.getElementById("envelopeImage");

const envelopeFrames = [
    "assets/amplop1.png",
    "assets/amplop2.png",
    "assets/amplop3.png",
    "assets/amplop4.png"
];

let envelopeIndex = 0;

envelopeImage.addEventListener("click",()=>{

    if(envelopeIndex < envelopeFrames.length - 1){

        envelopeIndex++;

        envelopeImage.style.opacity = 0;

        setTimeout(()=>{

            envelopeImage.src = envelopeFrames[envelopeIndex];

            envelopeImage.style.opacity = 1;

        },200);

    }

});

const videos = document.querySelectorAll(".videoPlayer");

videos.forEach((video)=>{

    const parent = video.parentElement;


    parent.addEventListener("click",()=>{

        if(video.paused && !video.ended){

            video.play();

        }else if(video.ended){

            parent.classList.remove("active");

            const nextPage = pages[pages.indexOf(parent)+1];

            if(nextPage){

                nextPage.classList.add("active");

            }

        }

    });

    video.addEventListener("ended",()=>{

    });

});

setInterval(createHeart,400);

</script>

</body>
</html>
