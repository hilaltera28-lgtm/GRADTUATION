<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Happy Graduation</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    overflow:hidden;
    background:linear-gradient(to bottom,#ffd6e7,#fff0f5);
    height:100vh;
    color:white;
}

.screen{
    width:100%;
    height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    position:absolute;
    top:0;
    left:0;
    padding:30px;
    text-align:center;
    transition:0.8s;
}

.hidden{
    opacity:0;
    pointer-events:none;
    transform:scale(1.05);
}

h1{
    font-size:28px;
    line-height:1.5;
    color:#ff4f8b;
    margin-bottom:30px;
    text-shadow:0 0 10px rgba(255,255,255,0.6);
}

.loginText{
    display:flex;
    flex-direction:column;

    gap:12px;

    margin-bottom:30px;

    width:100%;

    align-items:center;

    text-align:center;

    transform:translateY(65px);
}
    
.title1{
    font-size:24px;
    line-height:1.3;

    color:#ff4f8b;
    text-shadow:0 0 10px rgba(255,255,255,0.6);

    font-weight:600;
}

.title2{
    font-size:14px;
    line-height:1.5;

    color:#ff6fa5;
}

input{
    width:100%;
    max-width:320px;
    padding:15px;
    border:none;
    border-radius:18px;
    outline:none;
    font-size:16px;
    background:rgba(255,255,255,0.7);
    color:#ff4f8b;
    text-align:center;
    backdrop-filter:blur(10px);
}

button{
    margin-top:15px;
    padding:13px 28px;
    border:none;
    border-radius:20px;
    background:#ff6fa5;
    color:white;
    font-size:16px;
    cursor:pointer;
    transition:0.3s;
}

button:active{
    transform:scale(0.95);
}

.error{
    margin-top:12px;
    color:#ff2d55;
    font-size:14px;
}

.page{
    width:100%;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:35px;
    position:absolute;
    top:0;
    left:0;

    opacity:0;
    pointer-events:none;

    transition:0.5s;
}

.page.active{
    opacity:1;
    pointer-events:auto;
}

.text-box{
    font-size:16px;
    line-height:1.8;
    color:#ff4f8b;
    font-weight:500;
    min-height:100px;
    white-space:pre-line;
    transform:translateY(70px);
}

.tap{
    position:absolute;
    bottom:40px;
    font-size:14px;
    color:#ff7da8;
    animation:blink 1.5s infinite;
}

@keyframes blink{
    0%{opacity:0.3;}
    50%{opacity:1;}
    100%{opacity:0.3;}
}

/* floating hearts */
.heart{
    position:absolute;
    bottom:-20px;
    color:#ff8db7;
    animation:float 6s linear infinite;
    opacity:0.6;
}

.envelope-container{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    transform:translateY(100px);
}

.envelope{
    width:550px;
    transition:0.5s;
    animation:pop 2s infinite ease-in-out;
}

.sceneImage{
    width:100vw;
    height:100vh;

    object-fit:cover;

    display:block;

    opacity:1;

    transition:0.4s ease;
}

@keyframes pop{
    0%{
        transform:scale(1);
    }
    50%{
        transform:scale(1.03);
    }
    100%{
        transform:scale(1);
    }
}

@keyframes float{
    0%{
        transform:translateY(0) scale(1);
        opacity:0;
    }
    20%{
        opacity:0.7;
    }
    100%{
        transform:translateY(-110vh) scale(1.8);
        opacity:0;
    }
}
</style>
</head>

<body>

<!-- LOGIN PAGE -->
<div class="loginText">

    <div class="title1">
        Halloo, Happy graduation yaaa!!
    </div>

    <div class="title2">
        Password buat masuknya nanti aku kasih pas kamu udahh di rumahh, kabarin ajaa!!
    </div>

</div>

    <input type="teks" id="password" placeholder="masukkan password...">

    <button onclick="checkPassword()">masuk</button>

    <div class="error" id="errorText"></div>

</div>


<!-- PAGE 1 -->
<div class="page" id="page1">
    <div>
        <div class="text-box" id="text1"></div>
        <div class="tap">tap to continue ♡</div>
    </div>
</div>

<!-- PAGE 2 -->
<div class="page" id="page2">
    <div>
        <div class="text-box" id="text2"></div>
        <div class="tap">tap to continue ♡</div>
    </div>
</div>

<!-- PAGE 3 -->
<div class="page" id="page3">
    <div>
        <div class="text-box" id="text3"></div>
        <div class="tap">tap to continue ♡</div>
    </div>
</div>

<!-- PAGE 4 -->
<div class="page" id="page4">
    <div>
        <div class="text-box" id="text4"></div>
        <div class="tap">tap to continue ♡</div>
    </div>
</div>

<!-- SCENE 1 -->
<div class="page" id="scenePage1">
    <img src="assets/scene1.png" class="sceneImage">
</div>

<!-- SCENE 2 -->
<div class="page" id="scenePage2">
    <img src="assets/scene2.png" class="sceneImage">
</div>

<!-- SCENE 3 -->
<div class="page" id="scenePage3">
    <img src="assets/scene3.png" class="sceneImage">
</div>

<!-- SCENE 4 -->
<div class="page" id="scenePage4">
    <img src="assets/scene4.png" class="sceneImage">
</div>

<!-- SCENE 5 -->
<div class="page" id="scenePage5">
    <img src="assets/scene5.png" class="sceneImage">
</div>

<!-- SCENE 6 -->
<div class="page" id="scenePage6">
    <img src="assets/scene6.png" class="sceneImage">
</div>

<!-- ENVELOPE PAGE -->
<div class="page" id="page5">
    
    <div class="envelope-container">

        <img src="assets/amplop1.png" id="envelopeImage" class="envelope">

        <div class="tap">
            tap the envelope ♡
        </div>

    </div>

</div>

<!-- ENDING PAGE -->
<div class="page" id="endingPage">

    <div class="text-box" id="endingText"></div>

</div>

<!-- AUDIO -->
<audio id="bgm" loop playsinline>
    <source src="assets/musik.mp3" type="audio/mp3">
</audio>


<script>

/* =========================
   EDIT TULISAN DI SINI
========================= */

const message1 = `YEYYYYYY LULUSSS!! CONGRATS YAAAA`;

const message2 = `SYUMM PASTI KAMUU CAPEK POLL BUAT HARI INIII, IT'S OKEY LAH YAA BUAT LAST DAY IN SMADA TERCINTAA♡`;

const message3 = `SO PROUD OF YOU BISA NGELEWATIN MASA MASA INIIII`;

const message4 = `JUJUR DEG-DEGAN BANGEET RASANYA AKUU NGASIIH WEB INI KE KAMUUU, SEMOGA KAMUU NGGA SHOCK YAAAA!!`;

const endingMessage = `Thank you \n Happy Graduation!!!♡`;
/* ========================= */


const pages = [
    document.getElementById("page1"),
    document.getElementById("page2"),
    document.getElementById("page3"),
    document.getElementById("page4"),

     document.getElementById("scenePage1"),
    document.getElementById("scenePage2"),
    document.getElementById("scenePage3"),
    document.getElementById("scenePage4"),
    document.getElementById("scenePage5"),
    document.getElementById("scenePage6"),

    document.getElementById("page5"),
    document.getElementById("endingPage")
];

let currentPage = 0;

function checkPassword(){

    const input = document.getElementById("password").value;
    const error = document.getElementById("errorText");
    const bgm = document.getElementById("bgm");

    if(input.toLowerCase() === "terry gemas"){

        bgm.play().catch(()=>{});

        document.getElementById("loginScreen").classList.add("hidden");

        pages[0].classList.add("active");

        typeWriter("text1", message1);

    }else{
        error.innerText = "passwordnya salahh :(";
    }
}

function goToNextPage(currentPageId){

    const currentPage = document.getElementById(currentPageId);

    const currentIndex = pages.indexOf(currentPage);

    if(currentIndex < pages.length - 1){

        currentPage.classList.remove("active");

        pages[currentIndex + 1].classList.add("active");

        if(currentIndex + 1 === 1){
            typeWriter("text2", message2);
        }

        if(currentIndex + 1 === 2){
            typeWriter("text3", message3);
        }

        if(currentIndex + 1 === 3){
            typeWriter("text4", message4);
        }

    }

}

function typeWriter(elementId, text){

    let i = 0;
    const speed = 35;

    document.getElementById(elementId).innerHTML = "";

    function typing(){

        if(i < text.length){

            document.getElementById(elementId).innerHTML += text.charAt(i);
            i++;
            setTimeout(typing, speed);

        }

    }

    typing();

}

/* floating hearts */

function createHeart(){

    const heart = document.createElement("div");

    heart.classList.add("heart");

    heart.innerHTML = "♡";

    heart.style.left = Math.random() * 100 + "vw";

    heart.style.fontSize = (Math.random() * 20 + 15) + "px";

    heart.style.animationDuration = (Math.random() * 3 + 4) + "s";

    document.body.appendChild(heart);

    setTimeout(()=>{
        heart.remove();
    },7000);

}

const envelopePage = document.getElementById("page5");

const envelopeImage = document.getElementById("envelopeImage");

const envelopeFrames = [
    "assets/amplop1.png",
    "assets/amplop2.png",
    "assets/amplop3.png",
    "assets/amplop4.png",
    "assets/amplop5.png",
    "assets/amplop6.png"
];

let envelopeIndex = 0;

envelopePage.addEventListener("click",()=>{

    if(envelopeIndex < envelopeFrames.length - 1){

        envelopeIndex++;

        envelopeImage.style.opacity = 0;

        setTimeout(()=>{

            envelopeImage.src = envelopeFrames[envelopeIndex];

            envelopeImage.style.opacity = 1;

        },200);

    }else{

        envelopePage.classList.remove("active");

        document.getElementById("endingPage").classList.add("active");

        typeWriter("endingText", endingMessage);

    }

});

const scenePages = document.querySelectorAll('[id^="scenePage"]');

document.getElementById("page1").addEventListener("click",()=>{
    goToNextPage("page1");
});

document.getElementById("page2").addEventListener("click",()=>{
    goToNextPage("page2");
});

document.getElementById("page3").addEventListener("click",()=>{
    goToNextPage("page3");
});

document.getElementById("page4").addEventListener("click",()=>{
    goToNextPage("page4");
});

document.getElementById("scenePage1").addEventListener("click",()=>{
    goToNextPage("scenePage1");
});

document.getElementById("scenePage2").addEventListener("click",()=>{
    goToNextPage("scenePage2");
});

document.getElementById("scenePage3").addEventListener("click",()=>{
    goToNextPage("scenePage3");
});

document.getElementById("scenePage4").addEventListener("click",()=>{
    goToNextPage("scenePage4");
});

document.getElementById("scenePage5").addEventListener("click",()=>{
    goToNextPage("scenePage5");
});

document.getElementById("scenePage6").addEventListener("click",()=>{
    goToNextPage("scenePage6");
});

setInterval(createHeart,400);

</script>

</body>
</html>
